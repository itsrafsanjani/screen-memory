appId: com.screenmemory.app
productName: Screen Memory
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: swift-ocr/.build/release/screen-memory-ocr
    to: bin/screen-memory-ocr
  - from: swift-ocr/.build/release/screen-memory-appstate
    to: bin/screen-memory-appstate
  - from: resources/iconTemplate.png
    to: iconTemplate.png
  - from: resources/iconTemplate@2x.png
    to: iconTemplate@2x.png
  - from: resources/iconTemplate@3x.png
    to: iconTemplate@3x.png
  - from: src/main/db/migrations
    to: db-migrations
    filter:
      - '**/*'
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**
mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    NSScreenCaptureUsageDescription: Screen Memory needs screen recording access to capture screenshots of your desktop.
  notarize: false
  identity: null
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  artifactName: 'Screen-Memory-${version}-arm64.${ext}'
npmRebuild: false
publish:
  provider: github
  owner: itsrafsanjani
  repo: screen-memory
