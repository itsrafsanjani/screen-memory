name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build Swift helpers
        run: pnpm run build:swift

      - name: Verify Swift helper binaries
        run: |
          for binary in screen-memory-ocr screen-memory-appstate; do
            path="swift-ocr/.build/release/$binary"
            if [ ! -x "$path" ]; then
              echo "::error::Expected Swift helper at $path"
              exit 1
            fi
          done

      - name: Build Electron app
        run: pnpm exec electron-vite build && pnpm exec electron-builder --mac --dir

      - name: Write the auto-update feed
        run: |
          cat > "dist/mac-arm64/Screen Memory.app/Contents/Resources/app-update.yml" <<EOF
          provider: github
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          updaterCacheDirName: screen-memory-updater
          EOF

      - name: Verify the packaged app is complete
        run: ./scripts/verify-packaged-app.sh "dist/mac-arm64/Screen Memory.app" arm64

      - name: Ad-hoc sign the app
        run: codesign --deep --force --sign - "dist/mac-arm64/Screen Memory.app"

      - name: Package
        run: pnpm exec electron-builder --mac --publish never --prepackaged "dist/mac-arm64/Screen Memory.app"

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screen-memory-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
