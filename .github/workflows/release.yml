name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets a release be cut from any branch without tagging first.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.0). Defaults to the version in package.json.'
        type: string
        required: false
      draft:
        description: 'Publish as a draft release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Split out purely so the build job can key its concurrency group on the
  # resolved tag. `github.ref` cannot serve as that key: a tag push and a
  # workflow_dispatch from main can target the same version under different
  # refs, land in different groups, run together, and interleave their uploads
  # to one release — leaving a latest-mac.yml whose sha512 belongs to the other
  # run's DMG, which breaks auto-update for everyone until a human notices.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # electron-builder names the release after the package.json version, not
      # the git ref, so pushing v0.2.0 without bumping package.json would quietly
      # publish to v0.0.1 instead. Reconcile the two here and fail loudly rather
      # than let the mismatch through.
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p 'require("./package.json").version')"

          if [ "${{ github.event_name }}" = 'push' ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION." \
                   "Bump package.json to $TAG_VERSION and re-tag, or tag v$PKG_VERSION instead."
              exit 1
            fi
            VERSION="$PKG_VERSION"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="$PKG_VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

  build:
    needs: resolve
    runs-on: macos-14
    # Two releases writing assets to the same tag would race. Never cancel a run
    # in flight — a half-uploaded release is worse than a queued one. The
    # tag-free check below sits inside this gate on purpose, so a run that
    # queues behind a successful one fails instead of overwriting it.
    concurrency:
      group: release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # The resolver runs on a different machine, so its workspace is gone.
      # Writing the resolved version back is a no-op except on a dispatch that
      # overrode it, which is exactly the case electron-builder needs it for.
      - name: Pin the package version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: npm pkg set version="$VERSION"

      # electron-builder refuses to touch a published release older than two
      # hours and still exits 0, so without this guard a rerun looks green while
      # uploading nothing. Anything else would overwrite a live release's assets.
      - name: Ensure the release tag is free
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if ! STATE="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "No existing release for $TAG."
            exit 0
          fi
          if [ "$STATE" = 'true' ]; then
            echo "A draft release for $TAG already exists; its assets will be replaced."
            exit 0
          fi
          echo "::error::$TAG is already published. Bump the version instead of republishing it."
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Swift helpers
        run: pnpm run build:swift

      - name: Build Electron app
        run: pnpm exec electron-vite build && pnpm exec electron-builder --mac --dir

      # electron-builder writes this itself only during a pack whose targets
      # include dmg/zip, and the `--dir` then `--prepackaged` split never
      # satisfies that — so the updater would ship with no feed and fail
      # silently at startup. Written before the ad-hoc signature so the seal
      # covers it. Owner/repo come from the running repo, matching the publish
      # step, so a fork's builds update from the fork.
      - name: Write the auto-update feed
        run: |
          cat > "dist/mac-arm64/Screen Memory.app/Contents/Resources/app-update.yml" <<EOF
          provider: github
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          updaterCacheDirName: screen-memory-updater
          EOF

      - name: Verify the packaged app is complete
        run: ./scripts/verify-packaged-app.sh "dist/mac-arm64/Screen Memory.app" arm64

      - name: Ad-hoc sign the app
        run: codesign --deep --force --sign - "dist/mac-arm64/Screen Memory.app"

      # The publish target follows whichever repo is running this, so a fork
      # releases to itself instead of failing against the upstream repo.
      - name: Package and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec electron-builder --mac \
            --publish always \
            --prepackaged "dist/mac-arm64/Screen Memory.app" \
            -c.publish.provider=github \
            -c.publish.owner="${{ github.repository_owner }}" \
            -c.publish.repo="${{ github.event.repository.name }}" \
            -c.publish.releaseType="${{ (github.event_name == 'workflow_dispatch' && inputs.draft) && 'draft' || 'release' }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screen-memory-${{ needs.resolve.outputs.tag }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
