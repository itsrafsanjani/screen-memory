name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.0). Defaults to the version in package.json.'
        type: string
        required: false
      draft:
        description: 'Publish as a draft release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p 'require("./package.json").version')"

          if [ "${{ github.event_name }}" = 'push' ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION." \
                   "Bump package.json to $TAG_VERSION and re-tag, or tag v$PKG_VERSION instead."
              exit 1
            fi
            VERSION="$PKG_VERSION"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::Invalid version '$INPUT_VERSION'. Expected SemVer 2.0, e.g. 1.2.3 or 1.2.3-beta.1."
              exit 1
            fi
          else
            VERSION="$PKG_VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

  build:
    needs: resolve
    runs-on: macos-14
    concurrency:
      group: release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Pin the package version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Ensure the release tag is free
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if ! OUTPUT="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>&1)"; then
            if echo "$OUTPUT" | grep -qi 'release not found'; then
              echo "No existing release for $TAG."
              exit 0
            fi
            echo "::error::Failed to check for an existing release for $TAG: $OUTPUT"
            exit 1
          fi
          STATE="$OUTPUT"
          if [ "$STATE" = 'true' ]; then
            echo "A draft release for $TAG already exists; its assets will be replaced."
            exit 0
          fi
          echo "::error::$TAG is already published. Bump the version instead of republishing it."
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Swift helpers
        run: pnpm run build:swift

      - name: Build Electron app
        run: pnpm exec electron-vite build && pnpm exec electron-builder --mac --dir

      - name: Write the auto-update feed
        run: |
          cat > "dist/mac-arm64/Screen Memory.app/Contents/Resources/app-update.yml" <<EOF
          provider: github
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          updaterCacheDirName: screen-memory-updater
          EOF

      - name: Verify the packaged app is complete
        run: ./scripts/verify-packaged-app.sh "dist/mac-arm64/Screen Memory.app" arm64

      - name: Ad-hoc sign the app
        run: codesign --deep --force --sign - "dist/mac-arm64/Screen Memory.app"

      - name: Package and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec electron-builder --mac \
            --publish always \
            --prepackaged "dist/mac-arm64/Screen Memory.app" \
            -c.publish.provider=github \
            -c.publish.owner="${{ github.repository_owner }}" \
            -c.publish.repo="${{ github.event.repository.name }}" \
            -c.publish.releaseType="${{ (github.event_name == 'workflow_dispatch' && inputs.draft) && 'draft' || 'release' }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screen-memory-${{ needs.resolve.outputs.tag }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
