name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets a release be cut from any branch without tagging first.
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as a prerelease'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Swift helpers
        run: pnpm run build:swift

      - name: Build Electron app
        run: pnpm exec electron-vite build && pnpm exec electron-builder --mac --dir

      - name: Ad-hoc sign the app
        run: codesign --deep --force --sign - "dist/mac-arm64/Screen Memory.app"

      # The publish target follows whichever repo is running this, so a fork
      # releases to itself instead of failing against the upstream repo.
      - name: Package and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec electron-builder --mac \
            --publish always \
            --prepackaged "dist/mac-arm64/Screen Memory.app" \
            -c.publish.provider=github \
            -c.publish.owner="${{ github.repository_owner }}" \
            -c.publish.repo="${{ github.event.repository.name }}" \
            -c.publish.releaseType="${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) && 'prerelease' || 'release' }}"
